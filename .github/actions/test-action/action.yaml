name: "test"

inputs:
  bool:
    required: true

runs:
  using: "composite"
  steps:
    - if: "inputs.bool == true"
      shell: "bash"
      run: "echo bool == true"

    - if: "inputs.bool == 'true'"
      shell: "bash"
      run: "echo bool == 'true'"

    - if: "inputs.bool == 1"
      shell: "bash"
      run: "echo bool == 1"
